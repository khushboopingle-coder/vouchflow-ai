# Alembic (database migrations) for VouchFlow AI
#
#   python -m alembic upgrade head      # create / update all tables
#   python -m alembic current           # show the database's version
#   python -m alembic revision --autogenerate -m "what changed"   # after editing models
#
# The database link is NOT stored here. migrations/env.py reads it from
# DATABASE_URL in .env (via backend/config.py). Missing -> local SQLite.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
